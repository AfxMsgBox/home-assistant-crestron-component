# Type-check only the Home-Assistant-independent modules. Platform modules
# import Home Assistant itself, which is intentionally not installed by the
# lightweight test workflow.
[mypy]
files =
    custom_components/crestron/value_coercion.py,
    custom_components/crestron/xsig_protocol.py,
    custom_components/crestron/join_commands.py,
    custom_components/crestron/join_registry.py
python_version = 3.11
warn_unused_ignores = True
warn_redundant_casts = True
disallow_incomplete_defs = True
follow_imports = silent
ignore_missing_imports = True
