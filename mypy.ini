# Type-checking is scoped to the Home-Assistant-independent pure-logic modules
# (same set the unit tests cover). The entity/platform modules import
# `homeassistant`, whose types aren't available in this bare environment, so
# they are intentionally out of scope — annotating them would be unchecked.
#
#   pip install mypy
#   mypy --config-file mypy.ini
[mypy]
files =
    custom_components/crestron/value_coercion.py,
    custom_components/crestron/xsig_protocol.py,
    custom_components/crestron/join_commands.py
python_version = 3.11
warn_unused_ignores = True
warn_redundant_casts = True
disallow_incomplete_defs = True
# Don't pull HA-dependent modules into the check just because they import these
# pure ones; and don't fail on the (unavailable) homeassistant/voluptuous stubs.
follow_imports = silent
ignore_missing_imports = True
