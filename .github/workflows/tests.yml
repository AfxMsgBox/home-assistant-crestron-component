name: tests

on:
  push:
  pull_request:

jobs:
  dashboards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check dashboard files and deploy logic
        run: |
          node tools/deploy_dashboards.mjs --dir dashboard --check
          node --test tests/test_deploy_dashboards.mjs
          bash -n tools/deploy_to_ha.sh

  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # Platform tests stub Home Assistant, but still use real voluptuous
        # schemas. mypy checks the HA-independent modules listed in mypy.ini.
        run: pip install -r requirements-test.txt

      - name: Run unittest suite
        run: python -m unittest discover -s tests -v

      - name: Type-check pure-logic modules
        run: mypy --config-file mypy.ini
